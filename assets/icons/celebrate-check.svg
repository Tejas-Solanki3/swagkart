<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- confetti field -->
  <g>
    <rect x="24" y="40" width="16" height="9" rx="2" fill="#E5876C" transform="rotate(24 32 44)"/>
    <rect x="154" y="32" width="16" height="9" rx="2" fill="#4A78AC" transform="rotate(-18 162 36)"/>
    <rect x="164" y="96" width="14" height="8" rx="2" fill="#E9B44C" transform="rotate(38 171 100)"/>
    <rect x="22" y="96" width="14" height="8" rx="2" fill="#417A58" transform="rotate(-30 29 100)"/>
    <circle cx="54" cy="28" r="5" fill="#E5876C"/>
    <circle cx="148" cy="60" r="5" fill="#4A78AC"/>
    <circle cx="66" cy="170" r="6" fill="#E9B44C"/>
    <circle cx="140" cy="164" r="6" fill="#417A58"/>
  </g>
  <!-- burst rays -->
  <g stroke="#E9B44C" stroke-width="6" stroke-linecap="round">
    <line x1="100" y1="14" x2="100" y2="28"/>
    <line x1="46" y1="38" x2="56" y2="48"/>
    <line x1="154" y1="38" x2="144" y2="48"/>
